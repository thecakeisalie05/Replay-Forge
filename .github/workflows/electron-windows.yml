name: Electron Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Boxcars helper
        run: cargo build --release --manifest-path decoder/Cargo.toml
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Test replay normalizer
        run: node electron/test-normalize.cjs
      - name: Syntax-check Electron main process
        run: node --check electron/main.cjs
      - name: Check TypeScript and bundle renderer
        run: npm run check
      - name: Build NSIS Windows installer
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ReplayForge-Electron-Windows
          path: release/*.exe
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" release/*.exe --prerelease --title "Replay Forge Electron ${{ github.ref_name }}" --notes "Electron desktop foundation preview; directory indexing and library UI implemented, replay decoder and analytics pending."
