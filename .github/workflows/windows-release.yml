name: Windows installer
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish v0.1.0-preview as a prerelease after a successful build'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and build portable exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m unittest discover -s tests -v
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReplayForge --paths . run_desktop.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ReplayForge.iss"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReplayForge-Windows
          path: |
            dist/ReplayForge.exe
            dist-installer/*.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v0.1.0-preview" dist-installer/*.exe dist/ReplayForge.exe --target "${{ github.sha }}" --title "Replay Forge v0.1.0-preview" --notes "Windows library foundation preview. Directory indexing is available; replay decoding, analytics and 3D viewing are not implemented yet." --prerelease
