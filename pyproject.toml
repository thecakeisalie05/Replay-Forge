[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-forge"
version = "0.1.0"
description = "Local-first Rocket League replay library indexer and API scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
replay-forge = "replay_forge.__main__:main"

[tool.setuptools.packages.find]
include = ["replay_forge*"]

[tool.setuptools.package-data]
replay_forge = ["web/*.html"]
